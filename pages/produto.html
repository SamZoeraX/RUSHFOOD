<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <!--conexão com o CSS-->
    <link rel="stylesheet" href="/style/produto.css">
    <!--logo da empresa para o navegador-->
    <link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body>
   <header>
    <div class="topo">

    <div class="logo">
        <img src="/assets/logo.png" alt="Logo do RushFood">
    </div>
    <!-- caixa de pesquisa -->
     <div class="caixa-pesquisa">
        <input type="text" placeholder="Encontre seu prato favorito...">
        <img src="/assets/pesquisar.png" alt="Ícone de pesquisa">
     </div>
     <div class="icones">
        <a href="">
            <img src="/assets/perfil.png" alt="login">
            <small>Olá visitante!</small>
            <p>ENTRAR</p>
        </a>
        <a href="">
            <img src="/assets/carrinho.png" alt="carrinho">
            <small>Meu</small>
            <p>CARRINHO</p>
        </a>
     </div>
       
</div>
        <!-- menu de navegação -->
        <nav class="menu">
                <a href="#">Home</a>
                <a href="#">Mercados</a>
                <a id="idcarrinho" href="#">Carrinho de compras</a>
                <a href="#">Bebidas</a>
                <a href="#">Restaurantes</a>

        </nav>
    </header>

    <!--AREA DOS DADOS DO PRODUTO-->
    <div class="area-detalhes">
        <div class="area-imagens">
           <div class="img-lateral"></div>
           <div class="img-principal"></div>

          </div>
         <div class="area-textos">

            </div>
        
    </div>

</body>
</html>
